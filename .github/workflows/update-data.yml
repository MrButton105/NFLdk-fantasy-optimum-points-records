name: Update Optimum Points Data

on:
  schedule:
    # Check twice daily so missed or delayed scheduled runs are recovered automatically.
    - cron: "0 12 * * *"
    - cron: "0 13 * * *"
  push:
    paths:
      - ".github/workflows/update-data.yml"
  workflow_dispatch:
    inputs:
      week:
        description: "Week to update (1-14)"
        required: true
        default: "1"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Determine weeks to update
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_WEEK: ${{ inputs.week }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          if (process.env.EVENT_NAME === "workflow_dispatch") {
            const week = Number(process.env.MANUAL_WEEK);

            if (!Number.isInteger(week) || week < 1 || week > 14) {
              throw new Error("Week must be between 1 and 14.");
            }

            fs.appendFileSync(process.env.GITHUB_OUTPUT, `weeks=${week}\nskip=false\n`);
            process.exit(0);
          }

          const parts = new Intl.DateTimeFormat("en-GB", {
            timeZone: "Europe/Copenhagen",
            year: "numeric",
            month: "2-digit",
            day: "2-digit"
          }).formatToParts(new Date());

          const values = Object.fromEntries(parts.map(part => [part.type, part.value]));
          const today = Date.UTC(
            Number(values.year),
            Number(values.month) - 1,
            Number(values.day)
          );

          // NFL regular-season Week 1 update anchor: Thursday, 17 September 2026.
          const firstUpdate = Date.UTC(2026, 8, 17);
          const targetWeek = Math.floor((today - firstUpdate) / (7 * 24 * 60 * 60 * 1000)) + 1;

          if (targetWeek < 1) {
            console.log("The 2026 regular season update window has not started.");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "skip=true\n");
            process.exit(0);
          }

          const cappedWeek = Math.min(targetWeek, 14);
          const season = JSON.parse(fs.readFileSync("data/season.json", "utf8"));
          const existingWeeks = new Set(season.weeks.map(item => Number(item.week)));
          const missingWeeks = [];

          for (let week = 1; week <= cappedWeek; week++) {
            if (!existingWeeks.has(week)) missingWeeks.push(week);
          }

          if (missingWeeks.length === 0) {
            console.log(`No missing weeks through Week ${cappedWeek}. Season updates stop at Week 14.`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "skip=true\n");
            process.exit(0);
          }

          console.log(`Updating missing weeks through Week ${cappedWeek}: ${missingWeeks.join(", ")}`);
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `weeks=${missingWeeks.join(",")}\nskip=false\n`
          );
          NODE

      - name: Fetch weekly data
        if: steps.target.outputs.skip != 'true'
        env:
          WEEKS: ${{ steps.target.outputs.weeks }}
        run: |
          for week in $(echo "$WEEKS" | tr ',' ' '); do
            echo "Fetching Week $week"
            WEEK="$week" node scripts/update-data.js
          done

      - name: Fetch current Fleaflicker standings
        run: node scripts/update-standings.js

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/season.json

          if ! git diff --cached --quiet; then
            git commit -m "Update Optimum Points data"
            git push
          else
            echo "No data changes to commit."
          fi
