name: Update Optimum Points Data

on:
  schedule:
    # GitHub cron uses UTC: 08:00 UTC = 09:00 Copenhagen in winter;
    # 13:00 UTC = 14:00 Copenhagen in winter.
    - cron: "0 8 * * 2"
    - cron: "0 13 * * 4"
  push:
    paths:
      - ".github/workflows/update-data.yml"
      - "scripts/update-standings.js"
  workflow_dispatch:
    inputs:
      week:
        description: "Week to update (1-14)"
        required: true
        default: "1"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Determine weeks to update
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_WEEK: ${{ inputs.week }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          if (process.env.EVENT_NAME === "workflow_dispatch") {
            const week = Number(process.env.MANUAL_WEEK);

            if (!Number.isInteger(week) || week < 1 || week > 14) {
              throw new Error("Week must be between 1 and 14.");
            }

            fs.appendFileSync(process.env.GITHUB_OUTPUT, `weeks=${week}\nskip=false\n`);
            process.exit(0);
          }

          const parts = new Intl.DateTimeFormat("en-GB", {
            timeZone: "Europe/Copenhagen",
            year: "numeric",
            month: "2-digit",
            day: "2-digit"
          }).formatToParts(new Date());

          const values = Object.fromEntries(parts.map(part => [part.type, part.value]));
          const today = Date.UTC(
            Number(values.year),
            Number(values.month) - 1,
            Number(values.day)
          );

          // Week 1 update anchor is Thursday, 17 September 2026.
          // Tuesday runs are shifted forward two days so Tuesday and Thursday
          // both target the same NFL week.
          const targetDate = today + 2 * 24 * 60 * 60 * 1000;
          const firstUpdate = Date.UTC(2026, 8, 17);
          const targetWeek = Math.floor(
            (targetDate - firstUpdate) / (7 * 24 * 60 * 60 * 1000)
          ) + 1;

          if (targetWeek < 1) {
            console.log("The 2026 regular season update window has not started.");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "skip=true\n");
            process.exit(0);
          }

          if (targetWeek > 14) {
            console.log("Week 14 has passed. Regular-season updates are stopped.");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "skip=true\n");
            process.exit(0);
          }

          const season = JSON.parse(fs.readFileSync("data/season.json", "utf8"));
          const existingWeeks = new Set(season.weeks.map(item => Number(item.week)));
          const weeksToUpdate = [];

          // Backfill any missing weeks, and ALWAYS refresh the current target week.
          // This second fetch (Thursday) picks up Fleaflicker stat corrections.
          for (let week = 1; week <= targetWeek; week++) {
            if (!existingWeeks.has(week) || week === targetWeek) {
              weeksToUpdate.push(week);
            }
          }

          console.log(`Refreshing weeks: ${weeksToUpdate.join(", ")}`);
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `weeks=${weeksToUpdate.join(",")}\nskip=false\n`
          );
          NODE

      - name: Fetch weekly data
        if: steps.target.outputs.skip != 'true'
        env:
          WEEKS: ${{ steps.target.outputs.weeks }}
        run: |
          for week in $(echo "$WEEKS" | tr ',' ' '); do
            echo "Fetching or refreshing Week $week"
            WEEK="$week" node scripts/update-data.js
          done

      - name: Fetch current Fleaflicker standings
        if: steps.target.outputs.skip != 'true'
        run: node scripts/update-standings.js

      - name: Save updated data
        if: steps.target.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/season.json

          if ! git diff --cached --quiet; then
            git commit -m "Update Optimum Points data"
            git push
          else
            echo "No data changes to commit."
          fi
